name: ralm
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  intl: ^0.20.2
  day_month_picker: ^1.0.1
  shared_preferences: ^2.5.3
  video_player: ^2.9.5
  responsive_framework: ^1.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/json/
    - assets/image/tarot/
    - assets/image/constellation/
    - assets/image/avatar/
    - assets/image/ideal_type/boy/
    - assets/image/ideal_type/girl/
    - assets/video/
    - assets/bg/dream_sign_bg/
    - assets/bg/secret_crush_bg/

  fonts:
    - family: Tinos
      fonts:
        - asset: assets/fonts/Tinos-Regular.ttf
    - family: Whisper
      fonts:
        - asset: assets/fonts/Whisper-Regular.ttf